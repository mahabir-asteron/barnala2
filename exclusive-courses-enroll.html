<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enroll in Exclusive Courses | Barnala Driver Training Academy</title>
<meta name="description" content="Check your eligibility and enroll in Barnala Driver Training Academy's Exclusive Courses.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/style.css">

<style>
  .wizard-section { padding:0 0 100px; }
  .wizard-card {
    max-width:820px; margin:-60px auto 0; position:relative; z-index:5;
    background:#fff; border-radius:24px; padding:48px;
    box-shadow:0 24px 60px rgba(27,46,92,.14);
  }
  @media (max-width:640px) { .wizard-card { padding:32px 24px; margin-top:-40px; } }

  .progress-wrapper { margin-bottom:36px; }
  .progress-bar { height:6px; background:var(--sky-tint); border-radius:999px; overflow:hidden; margin-bottom:10px; }
  .progress-bar span#progressFill {
    display:block; height:100%; width:25%;
    background:linear-gradient(90deg, var(--navy), var(--blue));
    border-radius:999px; transition:width .3s ease;
  }
  .progress-info { display:flex; align-items:center; justify-content:space-between; }
  .progress-info span { font-size:0.8rem; color:var(--ink-soft); font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.05em; }
  .back-btn { background:none; border:none; color:var(--blue); font-weight:600; font-size:0.85rem; cursor:pointer; }

  #wizardContent { text-align:center; transition:opacity .18s ease, transform .18s ease; }
  #wizardContent h2 { font-size:1.5rem; color:var(--navy); margin-bottom:12px; }
  .question-subtitle { color:var(--ink-soft); font-size:0.95rem; max-width:560px; margin:0 auto 32px; }

  .button-group { display:flex; justify-content:center; gap:16px; flex-wrap:wrap; }
  .button-group button, .result-btn, .submit-btn {
    font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.03em;
    border:none; border-radius:999px; cursor:pointer; transition:.25s;
    background:linear-gradient(135deg, var(--navy), var(--blue)); color:#fff;
    padding:16px 36px; font-size:0.95rem;
  }
  .button-group button:hover, .result-btn:hover, .submit-btn:hover { transform:translateY(-3px); box-shadow:0 14px 28px rgba(44,111,196,.28); }

  .licence-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; max-width:700px; margin:0 auto; }
  @media (max-width:640px) { .licence-grid { grid-template-columns:1fr 1fr; } }
  @media (max-width:420px) { .licence-grid { grid-template-columns:1fr; } }
  .licence-card {
    background:var(--sky-tint); border:2px solid transparent; border-radius:16px; padding:24px 18px;
    cursor:pointer; transition:.25s; text-align:center;
  }
  .licence-card:hover { border-color:var(--blue); transform:translateY(-3px); }
  .licence-card h3 { font-family:var(--font-display); color:var(--navy); font-size:1.05rem; margin-bottom:4px; }
  .licence-card p { font-size:0.85rem; margin:0; }

  .result-icon {
    width:64px; height:64px; border-radius:50%; margin:0 auto 20px;
    display:flex; align-items:center; justify-content:center; font-size:1.8rem; color:#fff;
  }
  .result-icon.success { background:#22c55e; }

  .enrollment-form { text-align:left; max-width:640px; margin:0 auto; }
  .enrollment-form h2 { text-align:center; }
  .enrollment-form .question-subtitle { text-align:center; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:18px; }
  @media (max-width:560px) { .form-row { grid-template-columns:1fr; } }
  .form-group { display:flex; flex-direction:column; margin-bottom:18px; }
  .form-row .form-group { margin-bottom:0; }
  .form-group label {
    font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.04em;
    font-size:0.78rem; color:var(--navy); margin-bottom:6px;
  }
  .form-group input, .form-group select, .form-group textarea {
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius);
    font-family:var(--font-body); font-size:0.95rem; color:var(--ink); background:#fff;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(44,111,196,.15);
  }
  .submit-btn { width:100%; padding:16px; margin-top:8px; }

  .thank-you { text-align:center; }

  .hero-actions-wizard { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:28px; }
</style>

</head>
<body>

<div id="header-placeholder"></div>

<section class="photo-hero-banner">
  <img src="images/exclusive-courses.webp" alt="Barnala Driver Training Academy truck fleet">
  <div class="overlay">
    <h1>Enroll in <em>Exclusive Courses</em></h1>
  </div>
</section>
<div class="lane-divider"></div>

<section class="section" style="padding-bottom:40px;">
  <div class="wrap" style="max-width:640px; text-align:center; margin-left:auto; margin-right:auto;">
    <p class="eyebrow">Exclusive Courses</p>
    <p class="lead">Select your preferred exclusive course, check your eligibility in under one minute, and complete your registration without leaving this page.</p>
    <div class="hero-actions-wizard">
      <a href="#wizard" class="btn btn-primary">Check Eligibility</a>
      <a href="exclusive-courses.html" class="btn btn-outline">Explore Courses</a>
    </div>
  </div>
</section>

<section class="wizard-section" id="wizard">
  <div class="wrap">
    <div class="wizard-card">

      <div class="progress-wrapper">
        <div class="progress-bar">
          <span id="progressFill"></span>
        </div>
        <div class="progress-info">
          <span id="progressText">Step 1 of 4</span>
          <button id="backBtn" class="back-btn" style="display:none;">&larr; Back</button>
        </div>
      </div>

      <div id="wizardContent"></div>

    </div>
  </div>
</section>

<section class="section section-alt">
  <div class="wrap">
    <div class="section-head">
      <p class="eyebrow">Gallery</p>
      <h2>Training in Action</h2>
    </div>
    <div class="photo-grid">
      <img src="images/class1-1.webp" alt="Barnala Class 1 training truck">
      <img src="images/gallery-2.png" alt="Barnala training truck fleet at sunset">
      <img src="images/hero-trucks.webp" alt="Barnala Driver Training Academy truck fleet">
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="js/include.js"></script>

<script>

const wizard = document.getElementById("wizardContent");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");
const backBtn = document.getElementById("backBtn");

const TOTAL_STEPS = 4;

let history = [];
let selectedCourse = "";

function render(html){
    wizard.style.opacity="0";
    wizard.style.transform="translateY(20px)";
    setTimeout(()=>{
        wizard.innerHTML=html;
        wizard.style.opacity="1";
        wizard.style.transform="translateY(0)";
    },180);
}

function updateProgress(step){
    progressFill.style.width=((step/TOTAL_STEPS)*100)+"%";
    progressText.textContent=`Step ${step} of ${TOTAL_STEPS}`;
}

function finishWizard(){
    progressFill.style.width="100%";
    progressText.textContent="Completed";
    backBtn.style.display="none";
}

function resetWizard(){
    history=[];
    selectedCourse="";
    backBtn.style.display="none";
    progressFill.style.width="25%";
    progressText.textContent="Step 1 of 4";
}

function saveStep(step){
    history.push(step);
    backBtn.style.display="inline-flex";
}

function goBack(){
    if(history.length===0){ return; }
    const previous=history.pop();
    previous();
}

backBtn.addEventListener("click",goBack);

function startWizard(){
    resetWizard();
    courseQuestion();
}

window.addEventListener("load",startWizard);

function courseQuestion(){
    updateProgress(1);
    render(`
        <h2>Which type of course do you want?</h2>
        <p class="question-subtitle">Select the course you would like to enroll in.</p>
        <div class="licence-grid">
            <div class="licence-card" onclick="selectCourse('Hours of Service Course')">
                <h3>Hours of Service</h3>
                <p>Compliance Training</p>
            </div>
            <div class="licence-card" onclick="selectCourse('Dangerous Goods Course')">
                <h3>Dangerous Goods</h3>
                <p>TDG Training</p>
            </div>
            <div class="licence-card" onclick="selectCourse('Load Securement Course')">
                <h3>Load Securement</h3>
                <p>Cargo Securement</p>
            </div>
            <div class="licence-card" onclick="selectCourse('Vehicle Inspection Course')">
                <h3>Vehicle Inspection</h3>
                <p>Daily Inspection</p>
            </div>
            <div class="licence-card" onclick="selectCourse('Winter Driving Course')">
                <h3>Winter Driving</h3>
                <p>Winter Safety Training</p>
            </div>
        </div>
    `);
}

function selectCourse(course){
    selectedCourse = course;
    saveStep(courseQuestion);

    if(course === "Winter Driving Course"){
        winterLicenceQuestion();
    }else{
        eligible();
    }
}

function winterLicenceQuestion(){
    updateProgress(2);
    render(`
        <h2>Which class of License do you have?</h2>
        <p class="question-subtitle">Select your current licence.</p>
        <div class="licence-grid">
            <div class="licence-card" onclick="winterLicenceSelected()">
                <h3>Class 5L</h3>
                <p>Learner Licence</p>
            </div>
            <div class="licence-card" onclick="winterLicenceSelected()">
                <h3>Class 5I</h3>
                <p>Intermediate Licence</p>
            </div>
            <div class="licence-card" onclick="winterLicenceSelected()">
                <h3>Class 5F</h3>
                <p>Full Licence</p>
            </div>
            <div class="licence-card" onclick="winterLicenceSelected()">
                <h3>Class 3</h3>
                <p>Commercial Licence</p>
            </div>
            <div class="licence-card" onclick="winterLicenceSelected()">
                <h3>Class 2</h3>
                <p>Bus Licence</p>
            </div>
        </div>
    `);
}

function winterLicenceSelected(){
    saveStep(winterLicenceQuestion);
    eligible();
}

function eligible(){
    finishWizard();
    render(`
        <div class="result-icon success">&#10003;</div>
        <h2>Congratulations!</h2>
        <p class="question-subtitle">You are eligible to enroll in<br><strong>${selectedCourse}</strong></p>
        <div class="button-group">
            <button onclick="showEnrollmentForm()">Proceed with Enrollment</button>
        </div>
    `);
}

function showEnrollmentForm(){
    finishWizard();

    window.scrollTo({
        top:document.querySelector(".wizard-section").offsetTop-80,
        behavior:"smooth"
    });

    render(`
<div class="enrollment-form">
    <h2>Registration Request for Exclusive Course</h2>
    <p class="question-subtitle">Complete the form below and our admissions team will contact you to complete your enrollment.</p>
    <form id="exclusiveCourseForm">
        <div class="form-row">
            <div class="form-group">
                <label>First Name *</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>Last Name *</label>
                <input type="text" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Phone Number *</label>
                <input type="tel" placeholder="(XXX) XXX-XXXX" required>
            </div>
            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" placeholder="sample@example.com" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Selected Course</label>
                <input type="text" value="${selectedCourse}" readonly>
            </div>
            <div class="form-group">
                <label>Branch *</label>
                <select required>
                    <option value="">Choose</option>
                    <option>Winnipeg</option>
                    <option>Steinbach</option>
                    <option>Portage la Prairie</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Message</label>
            <textarea rows="6" placeholder="Tell us anything you'd like us to know..."></textarea>
        </div>
        <button class="submit-btn" type="submit">Submit Registration Request</button>
    </form>
</div>
`);

    document.getElementById("exclusiveCourseForm").addEventListener("submit",function(e){
        e.preventDefault();
        showThankYou();
    });
}

function showThankYou(){
    render(`
<div class="thank-you">
    <div class="result-icon success">&#10003;</div>
    <h2>Thank You!</h2>
    <p>Your registration request has been received successfully. A member of the Barnala Driver Training Academy team will contact you shortly to complete your enrollment.</p>
    <br>
    <button class="result-btn" onclick="startWizard()">Return to Course Selection</button>
</div>
`);
}

</script>

</body>
</html>
