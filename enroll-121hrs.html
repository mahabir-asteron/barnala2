<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enroll in Class 1 (121.5 Hours) | Barnala Driver Training Academy</title>

<meta name="description" content="Check your eligibility and enroll in Barnala Driver Training Academy's Class 1 121.5 Hour Driver Training Program.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/style.css">

<style>

  .wizard-section {
    padding: 0 0 100px;
  }

  .wizard-card {
    max-width: 820px;
    margin: -20px auto 0;
    position: relative;
    z-index: 5;
    background: #fff;
    border-radius: 24px;
    padding: 48px;
    box-shadow: 0 24px 60px rgba(27,46,92,.14);
  }

  @media (max-width:640px) {
    .wizard-card {
      padding:32px 24px;
      margin-top:-16px;
    }
  }

  .progress-wrapper {
    margin-bottom:36px;
  }

  .progress-bar {
    height:6px;
    background:var(--sky-tint);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:10px;
  }

  .progress-bar span#progressFill {
    display:block;
    height:100%;
    width:16%;
    background:linear-gradient(90deg,var(--navy),var(--blue));
    border-radius:999px;
    transition:width .3s ease;
  }

  .progress-info {
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .progress-info span {
    font-size:0.8rem;
    color:var(--ink-soft);
    font-family:var(--font-display);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }

  .back-btn {
    background:none;
    border:none;
    color:var(--blue);
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
  }

  #wizardContent {
    text-align:center;
    transition:opacity .18s ease, transform .18s ease;
  }

  #wizardContent h2 {
    font-size:1.5rem;
    color:var(--navy);
    margin-bottom:12px;
  }

  .question-subtitle {
    color:var(--ink-soft);
    font-size:0.95rem;
    max-width:560px;
    margin:0 auto 32px;
  }

  .button-group {
    display:flex;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
  }

  .button-group button,
  .result-btn,
  .submit-btn {
    font-family:var(--font-display);
    text-transform:uppercase;
    letter-spacing:0.03em;
    border:none;
    border-radius:999px;
    cursor:pointer;
    transition:.25s;
    background:linear-gradient(135deg,var(--navy),var(--blue));
    color:#fff;
    padding:16px 36px;
    font-size:0.95rem;
  }

  .button-group button:hover,
  .result-btn:hover,
  .submit-btn:hover {
    transform:translateY(-3px);
    box-shadow:0 14px 28px rgba(44,111,196,.28);
  }

  .licence-grid {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
    max-width:520px;
    margin:0 auto;
  }

  @media (max-width:520px) {
    .licence-grid {
      grid-template-columns:1fr;
    }
  }

  .licence-card {
    background:var(--sky-tint);
    border:2px solid transparent;
    border-radius:16px;
    padding:24px 18px;
    cursor:pointer;
    transition:.25s;
    text-align:center;
  }

  .licence-card:hover {
    border-color:var(--blue);
    transform:translateY(-3px);
  }

  .licence-card h3 {
    font-family:var(--font-display);
    color:var(--navy);
    font-size:1.1rem;
    margin-bottom:4px;
  }

  .licence-card p {
    font-size:0.85rem;
    margin:0;
  }

  .result-icon {
    width:64px;
    height:64px;
    border-radius:50%;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.8rem;
    color:#fff;
  }

  .result-icon.success {
    background:#22c55e;
  }

  .not-eligible-screen .result-icon {
    display:none;
  }

  .enrollment-form {
    text-align:left;
    max-width:640px;
    margin:0 auto;
  }

  .enrollment-form h2 {
    text-align:center;
  }

  .enrollment-form .question-subtitle {
    text-align:center;
  }

  .form-row {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:18px;
  }

  @media (max-width:560px) {
    .form-row {
      grid-template-columns:1fr;
    }
  }

  .form-group {
    display:flex;
    flex-direction:column;
    margin-bottom:18px;
  }

  .form-row .form-group {
    margin-bottom:0;
  }

  .form-group label {
    font-family:var(--font-display);
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-size:0.78rem;
    color:var(--navy);
    margin-bottom:6px;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-family:var(--font-body);
    font-size:0.95rem;
    color:var(--ink);
    background:#fff;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline:none;
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(44,111,196,.15);
  }

  .submit-btn {
    width:100%;
    padding:16px;
    margin-top:8px;
  }

  .thank-you {
    text-align:center;
  }

  .hero-actions-wizard {
    display:flex;
    gap:16px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:28px;
  }

  .select-wrap {
    position:relative;
  }

  .select-wrap select {
    appearance:none;
    -webkit-appearance:none;
    width:100%;
    padding-right:55px;
  }

  .select-arrow {
    position:absolute;
    right:35px;
    top:50%;
    transform:translateY(-50%);
    font-size:22px;
    color:var(--ink);
    pointer-events:none;
  }

</style>

</head>

<body>

<div id="header-placeholder"></div>


<!-- =========================================
     HERO
========================================= -->

<section class="photo-hero-banner">

  <img
    src="images/hero-trucks.webp"
    alt="Barnala Class 1 truck driver training">

  <div class="overlay">

    <h1>
      Enroll in <em>Class 1 Training</em>
    </h1>

  </div>

</section>

<div class="lane-divider"></div>


<!-- =========================================
     INTRO
========================================= -->

<section class="section" style="padding-bottom:40px;">

  <div
    class="wrap"
    style="max-width:640px; text-align:center; margin-left:auto; margin-right:auto;"
  >

    <p class="eyebrow">
      Class 1 Driver Training &middot; 121.5 Hours
    </p>

    <p class="lead">
      Check your eligibility in under one minute. If you qualify,
      complete your registration immediately without leaving this page.
    </p>

    <div class="hero-actions-wizard">

      <a
        href="#wizard"
        class="btn btn-primary">
        Check Eligibility
      </a>

      <a
        href="class-1-121-hours.html"
        class="btn btn-outline">
        Learn About Class 1
      </a>

    </div>

  </div>

</section>


<!-- =========================================
     ELIGIBILITY WIZARD
========================================= -->

<section
  class="wizard-section"
  id="wizard"
>

  <div class="wrap">

    <div class="wizard-card">

      <!-- PROGRESS -->

      <div class="progress-wrapper">

        <div class="progress-bar">

          <span id="progressFill"></span>

        </div>

        <div class="progress-info">

          <span id="progressText">
            Step 1 of 6
          </span>

          <button
            id="backBtn"
            class="back-btn"
            style="display:none;"
          >
            &larr; Back
          </button>

        </div>

      </div>


      <!-- WIZARD CONTENT -->

      <div id="wizardContent"></div>

    </div>

  </div>

</section>


<!-- =========================================
     FOOTER
========================================= -->

<div id="footer-placeholder"></div>

<script src="js/include.js"></script>


<script>

/* =========================================
   WIZARD VARIABLES
========================================= */

const wizard = document.getElementById("wizardContent");

const progressFill =
  document.getElementById("progressFill");

const progressText =
  document.getElementById("progressText");

const backBtn =
  document.getElementById("backBtn");

const TOTAL_STEPS = 6;

let history = [];


/* =========================================
   RENDER
========================================= */

function render(html) {

  wizard.style.opacity = "0";
  wizard.style.transform = "translateY(20px)";

  setTimeout(() => {

    wizard.innerHTML = html;

    wizard.style.opacity = "1";
    wizard.style.transform = "translateY(0)";

  },180);

}


/* =========================================
   PROGRESS
========================================= */

function updateProgress(step) {

  progressFill.style.width =
    ((step / TOTAL_STEPS) * 100) + "%";

  progressText.textContent =
    `Step ${step} of ${TOTAL_STEPS}`;

}


function finishWizard() {

  progressFill.style.width = "100%";

  progressText.textContent = "Completed";

  backBtn.style.display = "none";

}


function resetWizard() {

  history = [];

  backBtn.style.display = "none";

  progressFill.style.width = "16%";

  progressText.textContent = "Step 1 of 6";

}


function saveStep(step) {

  history.push(step);

  backBtn.style.display = "inline-flex";

}


function goBack() {

  if (history.length === 0) {
    return;
  }

  const previous = history.pop();

  previous();

}


backBtn.addEventListener(
  "click",
  goBack
);


/* =========================================
   START
========================================= */

function startWizard() {

  resetWizard();

  ageQuestion();

}


window.addEventListener(
  "load",
  startWizard
);


/* =========================================
   ELIGIBLE
========================================= */

function eligible() {

  finishWizard();

  render(`

    <div class="result-icon success">
      &#10003;
    </div>

    <h2>
      You're Eligible!
    </h2>

    <p class="question-subtitle">
      Congratulations! You meet the eligibility requirements
      for Barnala's Class 1 (121.5 Hours) Driver Training Program.
    </p>

    <div class="button-group">

      <button onclick="showEnrollmentForm()">
        Proceed with Enrollment
      </button>

    </div>

  `);

}


/* =========================================
   NOT ELIGIBLE
========================================= */

function notEligible(message) {

  finishWizard();

  render(`

    <div class="not-eligible-screen">

      <h2>
        No Worries
      </h2>

      <p class="question-subtitle">
        ${message}
      </p>

      <div class="button-group">

        <button onclick="showEnrollmentForm()">
          Let's Connect
        </button>

      </div>

    </div>

  `);

}


/* =========================================
   QUESTION 1
========================================= */

function ageQuestion() {

  updateProgress(1);

  render(`

    <h2>
      Are you 18 years of age or older?
    </h2>

    <p class="question-subtitle">
      Applicants must be at least 18 years old
      to enroll in Barnala's Class 1 Driver Training Program.
    </p>

    <div class="button-group">

      <button onclick="ageYes()">
        Yes
      </button>

      <button onclick="ageNo()">
        No
      </button>

    </div>

  `);

}


function ageYes() {

  saveStep(ageQuestion);

  licenceQuestion();

}


function ageNo() {

  notEligible(
    "You must be at least 18 years old before you can enroll."
  );

}


/* =========================================
   QUESTION 2
========================================= */

function licenceQuestion() {

  updateProgress(2);

  render(`

    <h2>
      Which licence do you currently hold?
    </h2>

    <p class="question-subtitle">
      Select the licence you currently have.
    </p>

    <div class="licence-grid">

      <div
        class="licence-card"
        onclick="licence5L()"
      >

        <h3>Class 5L</h3>

        <p>
          Learner Licence
        </p>

      </div>


      <div
        class="licence-card"
        onclick="licence5I()"
      >

        <h3>Class 5I</h3>

        <p>
          Intermediate Licence
        </p>

      </div>


      <div
        class="licence-card"
        onclick="licence5F()"
      >

        <h3>Class 5F</h3>

        <p>
          Full Licence
        </p>

      </div>


      <div
        class="licence-card"
        onclick="licence3()"
      >

        <h3>Class 3</h3>

        <p>
          Commercial Licence
        </p>

      </div>


      <div
        class="licence-card"
        onclick="licence2()"
      >

        <h3>Class 2</h3>

        <p>
          Commercial Licence
        </p>

      </div>

    </div>

  `);

}


/* =========================================
   LICENCE RESULTS
========================================= */

function licence5L() {

  notEligible(
    "Please obtain your Class 5 Full Licence before enrolling."
  );

}


function licence5I() {

  notEligible(
    "Please complete the Intermediate stage and obtain your Class 5 Full Licence before enrolling."
  );

}


function licence5F() {

  saveStep(licenceQuestion);

  airBrakeQuestion();

}


function licence3() {

  saveStep(licenceQuestion);

  airBrakeQuestion();

}


function licence2() {

  saveStep(licenceQuestion);

  airBrakeQuestion();

}


/* =========================================
   QUESTION 3
========================================= */

function airBrakeQuestion() {

  updateProgress(3);

  render(`

    <h2>
      Have you passed the Air Brake Knowledge Test?
    </h2>

    <p class="question-subtitle">
      A valid Air Brake Knowledge Test is required
      before you can continue.
    </p>

    <div class="button-group">

      <button onclick="airBrakeYes()">
        Yes
      </button>

      <button onclick="airBrakeNo()">
        No
      </button>

    </div>

  `);

}


function airBrakeYes() {

  saveStep(airBrakeQuestion);

  class1KnowledgeQuestion();

}


function airBrakeNo() {

  notEligible(
    "Please complete the Air Brake Knowledge Test before enrolling."
  );

}


/* =========================================
   QUESTION 4
========================================= */

function class1KnowledgeQuestion() {

  updateProgress(4);

  render(`

    <h2>
      Have you passed the Class 1 Knowledge Test?
    </h2>

    <p class="question-subtitle">
      Passing the Class 1 Knowledge Test is required
      before training begins.
    </p>

    <div class="button-group">

      <button onclick="class1KnowledgeYes()">
        Yes
      </button>

      <button onclick="class1KnowledgeNo()">
        No
      </button>

    </div>

  `);

}


function class1KnowledgeYes() {

  saveStep(class1KnowledgeQuestion);

  medicalQuestion();

}


function class1KnowledgeNo() {

  notEligible(
    "Please pass the Class 1 Knowledge Test before enrolling."
  );

}


/* =========================================
   QUESTION 5
========================================= */

function medicalQuestion() {

  updateProgress(5);

  render(`

    <h2>
      Have you completed your Medical Examination?
    </h2>

    <p class="question-subtitle">
      A valid medical examination is required
      for Class 1 licensing.
    </p>

    <div class="button-group">

      <button onclick="medicalYes()">
        Yes
      </button>

      <button onclick="medicalNo()">
        No
      </button>

    </div>

  `);

}


function medicalYes() {

  saveStep(medicalQuestion);

  englishQuestion();

}


function medicalNo() {

  notEligible(
    "Please complete your Medical Examination before enrolling."
  );

}


/* =========================================
   QUESTION 6
========================================= */

function englishQuestion() {

  updateProgress(6);

  render(`

    <h2>
      Are you proficient in English language?
    </h2>

    <p class="question-subtitle">
      English language proficiency is required
      for this program.
    </p>

    <div class="button-group">

      <button onclick="englishYes()">
        Yes
      </button>

      <button onclick="englishNo()">
        No
      </button>

    </div>

  `);

}


function englishYes() {

  eligible();

}


function englishNo() {

  notEligible(
    "You must be proficient in English language before enrolling."
  );

}


/* =========================================
   ENROLLMENT FORM
========================================= */

function showEnrollmentForm() {

  finishWizard();

  window.scrollTo({

    top:
      document.querySelector(
        ".wizard-section"
      ).offsetTop - 80,

    behavior:"smooth"

  });


  render(`

    <div class="enrollment-form">

      <h2>
        Registration Request
      </h2>

      <p class="question-subtitle">
        Complete the form below and our admissions team
        will contact you to complete your Class 1 enrollment.
      </p>


      <form id="class121Form">


        <!-- FIRST & LAST NAME -->

        <div class="form-row">

          <div class="form-group">

            <label for="firstName">
              First Name *
            </label>

            <input
              id="firstName"
              name="firstName"
              type="text"
              required
            >

          </div>


          <div class="form-group">

            <label for="lastName">
              Last Name *
            </label>

            <input
              id="lastName"
              name="lastName"
              type="text"
              required
            >

          </div>

        </div>


        <!-- PHONE & EMAIL -->

        <div class="form-row">

          <div class="form-group">

            <label for="phone">
              Phone Number *
            </label>

            <input
              id="phone"
              name="phone"
              type="tel"
              required
            >

          </div>


          <div class="form-group">

            <label for="email">
              Email Address *
            </label>

            <input
              id="email"
              name="email"
              type="email"
              required
            >

          </div>

        </div>


        <!-- COURSE & BRANCH -->

        <div class="form-row">

          <div class="form-group">

            <label for="course">
              Course
            </label>

            <input
              id="course"
              type="text"
              value="Class 1 (121.5 Hours)"
              readonly
            >

          </div>


          <div class="form-group">

            <label for="branch">
              Preferred Branch *
            </label>

            <div class="select-wrap">

              <select
                id="branch"
                name="branch"
                required
              >

                <option value="">
                  Select Branch
                </option>

                <option>
                  Winnipeg
                </option>

                <option>
                  Steinbach
                </option>

              </select>

              <span class="select-arrow">
                ⌄
              </span>

            </div>

          </div>

        </div>


        <!-- START DATE -->

        <div class="form-row">

          <div class="form-group">

            <label for="startDate">
              Preferred Start Date
            </label>

            <input
              id="startDate"
              name="startDate"
              type="date"
            >

          </div>

        </div>


        <!-- ADDITIONAL INFORMATION -->

        <div class="form-group">

          <label for="message">
            Additional Information
          </label>

          <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Tell us anything you'd like us to know..."
          ></textarea>

        </div>


        <button
          class="submit-btn"
          type="submit"
        >
          Submit Registration Request
        </button>


      </form>

    </div>

  `);


  const form =
    document.getElementById("class121Form");


  form.addEventListener(
    "submit",
    function(e) {

      e.preventDefault();

      showThankYou();

    }
  );

}


/* =========================================
   THANK YOU
========================================= */

function showThankYou() {

  render(`

    <div class="thank-you">

      <div class="result-icon success">
        &#10003;
      </div>

      <h2>
        Thank You!
      </h2>

      <p>
        Your registration request has been received successfully.
        A member of the Barnala Driver Training Academy team
        will contact you shortly to complete your enrollment.
      </p>

      <br>

      <button
        class="result-btn"
        onclick="startWizard()"
      >
        Return to Eligibility Checker
      </button>

    </div>

  `);

}

</script>

</body>
</html>
