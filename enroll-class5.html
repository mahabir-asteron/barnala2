<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enroll in Class 5 | Barnala Driver Training Academy</title>
<meta name="description" content="Check your eligibility and enroll in Barnala Driver Training Academy's Class 5 Driver Training Program.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/style.css">

<style>
  .wizard-section { padding:0 0 100px; }
  .wizard-card {
    max-width:820px; margin:-60px auto 0; position:relative; z-index:5;
    background:#fff; border-radius:24px; padding:48px;
    box-shadow:0 24px 60px rgba(27,46,92,.14);
  }
  @media (max-width:640px) { .wizard-card { padding:32px 24px; margin-top:-40px; } }

  #wizardContent { text-align:center; }
  #wizardContent h2 { font-size:1.5rem; color:var(--navy); margin-bottom:12px; }
  .question-subtitle { color:var(--ink-soft); font-size:0.95rem; max-width:560px; margin:0 auto 32px; }

  .button-group { display:flex; justify-content:center; gap:16px; flex-wrap:wrap; }
  .button-group button, .result-btn, .submit-btn {
    font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.03em;
    border:none; border-radius:999px; cursor:pointer; transition:.25s;
    background:linear-gradient(135deg, var(--navy), var(--blue)); color:#fff;
    padding:16px 36px; font-size:0.95rem;
  }
  .button-group button:hover, .result-btn:hover, .submit-btn:hover { transform:translateY(-3px); box-shadow:0 14px 28px rgba(44,111,196,.28); }

  .result-icon {
    width:64px; height:64px; border-radius:50%; margin:0 auto 20px;
    display:flex; align-items:center; justify-content:center; font-size:1.8rem; color:#fff;
  }
  .result-icon.success { background:#22c55e; }
  .result-icon.error { background:#f3b35a; }

  .enrollment-form { text-align:left; max-width:640px; margin:0 auto; }
  .enrollment-form h2 { text-align:center; }
  .enrollment-form .question-subtitle { text-align:center; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:18px; }
  @media (max-width:560px) { .form-row { grid-template-columns:1fr; } }
  .form-group { display:flex; flex-direction:column; margin-bottom:18px; }
  .form-row .form-group { margin-bottom:0; }
  .form-group label {
    font-family:var(--font-display); text-transform:uppercase; letter-spacing:0.04em;
    font-size:0.78rem; color:var(--navy); margin-bottom:6px;
  }
  .form-group input, .form-group select, .form-group textarea {
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius);
    font-family:var(--font-body); font-size:0.95rem; color:var(--ink); background:#fff;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(44,111,196,.15);
  }
  .submit-btn { width:100%; padding:16px; margin-top:8px; }

  .thank-you { text-align:center; }

  .hero-actions-wizard { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:28px; }
</style>

</head>
<body>

<div id="header-placeholder"></div>

<section class="photo-hero-banner">
  <img src="images/class5-1.webp" alt="Barnala Class 5 driving lesson">
  <div class="overlay">
    <h1>Enroll in <em>Class 5 Training</em></h1>
  </div>
</section>
<div class="lane-divider"></div>

<section class="section" style="padding-bottom:40px;">
  <div class="wrap" style="max-width:640px; text-align:center; margin-left:auto; margin-right:auto;">
    <p class="eyebrow">Class 5 Driver Training</p>
    <p class="lead">Check your eligibility in under one minute. If you qualify, complete your registration immediately without leaving this page.</p>
    <div class="hero-actions-wizard">
      <a href="#wizard" class="btn btn-primary">Check Eligibility</a>
      <a href="class-5.html" class="btn btn-outline">Learn About Class 5</a>
    </div>
  </div>
</section>

<section class="wizard-section" id="wizard">
  <div class="wrap">
    <div class="wizard-card">
      <div id="wizardContent"></div>
    </div>
  </div>
</section>

<section class="section section-alt">
  <div class="wrap">
    <div class="section-head">
      <p class="eyebrow">Gallery</p>
      <h2>Training in Action</h2>
    </div>
    <div class="photo-grid">
      <img src="images/class5-1.webp" alt="Barnala Class 5 driving lesson">
      <img src="images/gallery-1.jpg" alt="Barnala training truck on the practice course">
      <img src="images/hero-trucks.webp" alt="Barnala Driver Training Academy truck fleet">
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="js/include.js"></script>

<script>

const wizard = document.getElementById("wizardContent");

window.addEventListener("load", function(){
    ageQuestion();
});

function ageQuestion(){
wizard.innerHTML = `
<h2>Are you 18 or plus?</h2>
<p class="question-subtitle">Applicants must be at least 18 years old before enrolling in Class 5 Driver Training.</p>
<div class="button-group">
<button onclick="ageYes()">Yes</button>
<button onclick="showContact()">No</button>
</div>
`;
}

function ageYes(){
knowledgeQuestion();
}

function knowledgeQuestion(){
wizard.innerHTML = `
<h2>Have you passed Class 5 Knowledge Test?</h2>
<p class="question-subtitle">Passing the Class 5 Knowledge Test is required before enrollment.</p>
<div class="button-group">
<button onclick="eligible()">Yes</button>
<button onclick="showContact()">No</button>
</div>
`;
}

function eligible(){
wizard.innerHTML = `
<div class="result-icon success">&#10003;</div>
<h2>Congratulations</h2>
<p class="question-subtitle">You are eligible to enrol in Class 5 course.</p>
<div class="button-group">
<button class="result-btn" onclick="showEnrollmentForm()">Proceed with Enrollment</button>
</div>
`;
}

function showContact(){
wizard.innerHTML = `
<div class="result-icon error">!</div>
<h2>No Worries</h2>
<p class="question-subtitle">Let's connect and make it possible.</p>
<div class="button-group">
<button class="result-btn" onclick="showContactForm()">Let's Connect</button>
</div>
`;
}

function showEnrollmentForm(){
wizard.innerHTML = `
<div class="enrollment-form">
<h2>Class 5 Enrollment Form</h2>
<p class="question-subtitle">Complete the form below and our admissions team will contact you shortly.</p>
<form id="enrollForm">
<div class="form-row">
<div class="form-group">
<label>First Name *</label>
<input type="text" required>
</div>
<div class="form-group">
<label>Last Name *</label>
<input type="text" required>
</div>
</div>
<div class="form-row">
<div class="form-group">
<label>Phone Number *</label>
<input type="tel" required>
</div>
<div class="form-group">
<label>Email Address *</label>
<input type="email" required>
</div>
</div>
<div class="form-row">
<div class="form-group">
<label>Preferred Branch *</label>
<select required>
<option value="">Select Branch</option>
<option>Winnipeg</option>
<option>Steinbach</option>
<option>Portage la Prairie</option>
</select>
</div>
<div class="form-group">
<label>Preferred Start Date</label>
<input type="date">
</div>
</div>
<div class="form-group">
<label>Additional Information</label>
<textarea rows="5"></textarea>
</div>
<button class="submit-btn" type="submit">Submit Enrollment</button>
</form>
</div>
`;

document.getElementById("enrollForm").addEventListener("submit",function(e){
e.preventDefault();
showThankYou();
});
}

function showContactForm(){
wizard.innerHTML = `
<div class="enrollment-form">
<h2>Let's Connect</h2>
<p class="question-subtitle">Complete the form below and our team will help you become eligible for Class 5 Driver Training.</p>
<form id="contactForm">
<div class="form-row">
<div class="form-group">
<label>First Name *</label>
<input type="text" required>
</div>
<div class="form-group">
<label>Last Name *</label>
<input type="text" required>
</div>
</div>
<div class="form-row">
<div class="form-group">
<label>Phone Number *</label>
<input type="tel" required>
</div>
<div class="form-group">
<label>Email Address *</label>
<input type="email" required>
</div>
</div>
<div class="form-group">
<label>How can we help you?</label>
<textarea rows="5" placeholder="Tell us how we can help..."></textarea>
</div>
<button class="submit-btn" type="submit">Send Request</button>
</form>
</div>
`;

document.getElementById("contactForm").addEventListener("submit",function(e){
e.preventDefault();
showThankYou();
});
}

function showThankYou(){
wizard.innerHTML = `
<div class="thank-you">
<div class="result-icon success">&#10003;</div>
<h2>Thank You!</h2>
<p>Your request has been received successfully. A member of the Barnala Driver Training Academy team will contact you shortly.</p>
<br>
<div class="button-group">
<button class="result-btn" onclick="ageQuestion()">Return to Eligibility Checker</button>
</div>
</div>
`;
}

</script>

</body>
</html>
